    <style>
      #joiplay-loading {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; align-items: center; justify-content: center;
        background: #101018; color: #eee; font: 16px sans-serif;
      }
      #joiplay-loading-box { width: min(92vw, 700px); text-align: center; }
      #joiplay-loading-image { display: block; width: min(92vw, 700px); height: auto;
        margin: 0 auto 18px; image-rendering: auto; }
      #joiplay-loading-status { color: #bbb; min-height: 24px; }
      #joiplay-loading-track { height: 8px; margin-top: 16px; overflow: hidden;
        border-radius: 8px; background: #30303d; }
      #joiplay-loading-bar { height: 100%; width: 1%; border-radius: 8px;
        background: #8d72ff; transition: width .25s ease; }
      #joiplay-loading-error { display: none; margin-top: 18px; color: #ff8585;
        white-space: pre-wrap; word-break: break-word; text-align: left; }
      #joiplay-loading-log { max-height: 96px; overflow: hidden; margin-top: 12px;
        color: #777; font: 12px monospace; text-align: left; white-space: nowrap; }
    </style>
    <script>
      (function () {
        var overlay = document.createElement('div')
        overlay.id = 'joiplay-loading'
        overlay.innerHTML = '<div id="joiplay-loading-box">' +
          '<img id="joiplay-loading-image" src="./data/image/Loading.png" alt="Đang tải..." />' +
          '<div id="joiplay-loading-status">Đang khởi động engine...</div>' +
          '<div id="joiplay-loading-track"><div id="joiplay-loading-bar"></div></div>' +
          '<div id="joiplay-loading-copyright" style="margin-top:14px;color:#555;font:12px sans-serif;">© 2026 Ton\'s studio</div>' +
          '<div id="joiplay-loading-log"></div><div id="joiplay-loading-error"></div></div>'
        document.documentElement.appendChild(overlay)
        var started = Date.now()
        window.__joiplayLoading = {
          stage: function (text) {
            var node = document.getElementById('joiplay-loading-status')
            if (node) node.textContent = text
            this.log(text)
          },
          log: function (text) {
            var node = document.getElementById('joiplay-loading-log')
            if (!node) return
            var line = document.createElement('div')
            line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text
            node.appendChild(line)
            while (node.children.length > 5) node.removeChild(node.firstChild)
          },
          finish: function () {
            var node = document.getElementById('joiplay-loading')
            if (node) { node.style.opacity = '0'; node.style.transition = 'opacity .35s';
              setTimeout(function () { node.remove() }, 400) }
          },
          error: function (error) {
            var node = document.getElementById('joiplay-loading-error')
            var status = document.getElementById('joiplay-loading-status')
            if (status) status.textContent = 'Không thể khởi động game'
            if (node) { node.textContent = String(error && (error.stack || error.message) || error); node.style.display = 'block' }
          }
        }
        setInterval(function () {
          var bar = document.getElementById('joiplay-loading-bar')
          if (!bar || !window.performance) return
          var resources = performance.getEntriesByType('resource')
          var percent = Math.min(94, Math.max(3, 8 + resources.length * 2))
          bar.style.width = percent + '%'
          var status = document.getElementById('joiplay-loading-status')
          if (status && Date.now() - started > 1200) status.textContent = 'Đang tải assets... ' + percent + '%'
        }, 350)
        window.addEventListener('error', function (event) {
          if (window.__joiplayLoading) window.__joiplayLoading.error(event.error || event.message)
        })
        window.addEventListener('unhandledrejection', function (event) {
          if (window.__joiplayLoading) window.__joiplayLoading.error(event.reason)
        })
      })()
    </script>

    <!-- Hide-UI notification -->
    <style>
      #hideui-notify {
        position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
        z-index: 2147483646; padding: 4px 14px; border-radius: 6px;
        background: rgba(0,0,0,0.5); color: #ccc; font: 11px/1.4 sans-serif;
        white-space: nowrap; pointer-events: none; opacity: 0;
        transition: opacity .3s;
      }
      #hideui-notify.show {
        animation: hideui-pulse 3s ease-in-out infinite;
      }
      @keyframes hideui-pulse {
        0%, 100% { opacity: 0; }
        12%      { opacity: 1; }
        30%      { opacity: 1; }
        42%      { opacity: 0; }
      }
      @keyframes timing-pop-fade {
        0%   { transform: translateX(-50%) scale(0.3); opacity: 0; }
        15%  { transform: translateX(-50%) scale(1.3); opacity: 1; }
        30%  { transform: translateX(-50%) scale(1);   opacity: 1; }
        65%  { transform: translateX(-50%) scale(1);   opacity: 1; }
        100% { transform: translateX(-50%) scale(0.7) translateY(-20px); opacity: 0; }
      }
      .timing-display {
        position: fixed;
        left: 50%;
        top: 58%;
        z-index: 99999999999;
        text-align: center;
        pointer-events: none;
        font-weight: bold;
        text-shadow: 2px 2px 6px rgba(0,0,0,0.9), 0 0 12px currentColor;
        animation: timing-pop-fade 1.3s ease-out forwards;
      }
      .message_inner {
        overflow-y: auto;
        overflow-x: hidden;
        height: 100%;
        box-sizing: border-box;
        overflow-wrap: break-word;
        word-wrap: break-word;
      }
      .message_inner p {
        text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000;
      }
      .message_inner::-webkit-scrollbar {
        width: 6px;
      }
      .message_inner::-webkit-scrollbar-track {
        background: transparent;
      }
      .message_inner::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.3);
        border-radius: 3px;
      }
    </style>
